name: LetsHub live operations monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect cross-service GitHub status
        env:
          GITHUB_TOKEN: ${{ secrets.LETS_STATUS_TOKEN || github.token }}
        run: python scripts/collect_live_status.py
      - name: Publish changed snapshot
        run: |
          git config user.name "LetsHub Operations Bot"
          git config user.email "action@github.com"
          git add data/live_operations.json
          if git diff --cached --quiet; then
            echo "No operational change"
          else
            git commit -m "chore(ops): refresh live GitHub operations snapshot [skip ci]"
            git push
          fi
