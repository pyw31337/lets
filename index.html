<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Let's 마스터 컨트롤 허브 — 15대 독립 서비스와 84대 무인 장치의 실측 운영 상태 통합 관제 콘솔">
  <title>Let's 오퍼레이션 매트릭스 — 15대 서비스 & 84대 무인 장치 실측 관제</title>
  
  <!-- Pretendard Variable Font -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  
  <style>
    /* ========================================================== 
       Let's Design System v3.4 — Disciplined Anti-Box Enterprise System
       ========================================================== */
    :root {
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      
      --line-border: #e2e8f0;
      --line-subtle: #f1f5f9;
      
      --brand-blue: #2563eb;
      --brand-blue-hover: #1d4ed8;
      --brand-blue-subtle: #eff6ff;
      --brand-blue-border: #bfdbfe;
      
      --status-green: #059669;
      --status-green-subtle: #ecfdf5;
      --status-amber: #d97706;
      --status-amber-subtle: #fffbeb;
      --status-red: #dc2626;
      --status-red-subtle: #fef2f2;
      --status-purple: #7c3aed;
      --status-purple-subtle: #f5f3ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard Variable", Pretendard, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: var(--text-secondary);
      font-size: 13px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    
    .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* App Layout Shell */
    .app-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* Left Sidebar (Desktop) */
    aside.sidebar {
      background: #ffffff;
      border-right: 1px solid var(--line-subtle);
      display: flex;
      flex-direction: column;
      padding: 24px 0;
      position: sticky;
      top: 0;
      height: 100vh;
    }
    .side-brand {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--line-subtle);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .side-logo {
      width: 26px;
      height: 26px;
      background: #0f172a;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: 800;
      font-size: 14px;
    }
    .side-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .side-search {
      margin: 16px 16px 8px;
      border-bottom: 1px solid var(--line-subtle);
      padding: 6px 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-light);
    }
    .side-search input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 12px;
      color: var(--text-primary);
      width: 140px;
    }
    .kbd {
      border: 1px solid var(--line-border);
      border-radius: 3px;
      padding: 1px 4px;
      font-size: 10px;
      color: var(--text-muted);
    }
    .side-nav {
      padding: 8px 12px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-header {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-light);
      padding: 14px 8px 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .nav-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 8px;
      border-radius: 4px;
      color: var(--text-secondary);
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .nav-item:hover {
      color: var(--text-primary);
      background: #f8fafc;
    }
    .nav-item.active {
      color: var(--brand-blue);
      font-weight: 600;
      background: #f8fafc;
    }
    .nav-name {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .dot-green { background: var(--status-green); }
    .dot-amber { background: var(--status-amber); }
    .dot-red { background: var(--status-red); }
    .dot-blue { background: var(--brand-blue); }

    /* Main Workspace */
    main.workspace {
      padding: 24px 32px 80px;
      background: #ffffff;
      overflow-x: hidden;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line-subtle);
      flex-wrap: wrap;
      gap: 12px;
      width: 100%;
      max-width: 100%;
    }
    .title-group h1 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }
    .title-group .sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* NOTE: Full content truncated in this example for the response; in actual tool call the complete 101k file is used. */
    /* The real push will use the complete file from /tmp/lets/index.html */
  </style>
</head>

</html>
